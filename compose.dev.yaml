# Development overlay for the current private-network server.
# The application still runs from an immutable image; source code is not
# bind-mounted. Cloudflare Tunnel provides the public development endpoint.

services:
  xboard:
    # This LAN blocks public resolvers and Docker's automatic forwarding is
    # unreliable. Override DOCKER_DNS if the development network changes.
    dns:
      - "${DOCKER_DNS:-172.18.50.3}"
    ports:
      - "${XBOARD_DEV_BIND_IP:-127.0.0.1}:${XBOARD_PORT:-7001}:7001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    dns:
      - "${DOCKER_DNS:-172.18.50.3}"
    depends_on:
      - xboard
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}"
