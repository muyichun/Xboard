# Shared service definition for both development and deployment.
# Use `make dev` or `make deploy`; do not run this file alone because port,
# DNS, and tunnel settings intentionally live in the environment overlays.

name: xboard

services:
  xboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: xboard-local:latest
    restart: unless-stopped
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - docker=true

volumes:
  redis-data:
