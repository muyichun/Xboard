# Xboard —— 构建机与生产机共用同一份编排文件。
#
# 镜像只在构建机上构建一次，导出成 tar 包传到生产机导入；生产机不构建。
# 两边的差异放在各自的 .env 里（见 .env.example 的“部署参数”一节）：
#   构建机  XBOARD_BIND_IP=0.0.0.0    公网 IP 直连 http://<IP>:7001
#   生产机  XBOARD_BIND_IP=127.0.0.1  仅本机监听，由宿主机 nginx 反代 7001
#
# 应用代码与 composer 依赖全部构建进镜像；这里只挂载运行配置和持久化数据。
# 发布流程见 deploy.md。

name: xboard

services:
  xboard:
    # XBOARD_TAG 平时是 latest；回滚时用 `XBOARD_TAG=<git短sha> make recreate`
    # 临时覆盖，切到本机留存的历史镜像（make versions 可以看有哪些）。
    image: "${XBOARD_IMAGE:-xboard}:${XBOARD_TAG:-latest}"
    # 只有构建机会用到 build 段：所有重建容器的命令都带 --no-build --pull never，
    # 生产机不会在镜像缺失时偷偷改成本地构建（那会因为没有 submodule 而失败）。
    build:
      context: .
      dockerfile: Dockerfile
      # 构建加速源，默认阿里云（构建机在国内）。在别处构建时置空即可回官方源：
      #   ALPINE_MIRROR=
      # 这里用 ${VAR-default} 而非 ${VAR:-default}，前者才认「设为空字符串」。
      args:
        ALPINE_MIRROR: "${ALPINE_MIRROR-https://mirrors.aliyun.com/alpine}"
        COMPOSER_MIRROR: "${COMPOSER_MIRROR-https://mirrors.aliyun.com/composer/}"
    restart: unless-stopped
    ports:
      - "${XBOARD_BIND_IP:-127.0.0.1}:${XBOARD_PORT:-7001}:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      # minimal | balanced | performance | auto
      - RESOURCE_PROFILE=${RESOURCE_PROFILE:-balanced}
      - ENABLE_HORIZON=true
      - docker=true
    healthcheck:
      # 打的是无鉴权、无 Host 校验的 guest 接口，会真正走通 Caddy → Octane → DB/Redis。
      # 不用 "/" ：开启 safe_mode 后它会对不匹配 app_url 的 Host 返回 403。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7001/api/v1/guest/comm/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  redis-data:
