# Build an immutable application image from the current checkout.
# Application source is copied by Dockerfile; only runtime configuration and
# persistent data are mounted from the host. After updating the checkout, run:
#   docker compose build --pull
#   docker compose up -d --force-recreate --remove-orphans

services:
  xboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: xboard-local:latest
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./.env:/www/.env
      - ./.docker/.data/:/www/.docker/.data
      - ./storage/logs:/www/storage/logs
      - ./storage/theme:/www/storage/theme
      - ./plugins:/www/plugins
      - redis-data:/data
    environment:
      - RESOURCE_PROFILE=balanced      # minimal | balanced | performance | auto
      - ENABLE_HORIZON=true
      - docker=true

volumes:
  redis-data:
